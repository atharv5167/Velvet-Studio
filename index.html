
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Velvet Studio - Online Photo Booth</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #8D7A66; /* Warm deep taupe */
        color: #1A1A1A;
        overflow: hidden;
      }
      .font-serif {
        font-family: 'Playfair Display', serif;
      }
      .bg-studio-canvas {
        background-color: #D1C7BC; /* Soft warm beige */
      }
      .bg-studio-accent {
        background-color: #1A1A1A; /* Deep charcoal */
      }
      .text-studio-muted {
        color: #6B5E51;
      }
      /* Custom Scrollbar for Controls */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      /* Custom Curtain Texture */
      .curtain-texture {
        background-image: repeating-linear-gradient(
          90deg,
          rgba(0, 0, 0, 0.15) 0px,
          rgba(255, 255, 255, 0.03) 8px,
          rgba(0, 0, 0, 0.15) 16px
        );
      }
    </style>
